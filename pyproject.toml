[project]
name = "tbank-transaction-analyzer"
version = "0.1.0"
description = "Анализатор банковских транзакций Tinkoff"
authors = [
    {name = "Evgeny Danilov", email = "jkuujhx2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.4,<3.0.0",
    "pandas>=2.3.1,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "pytest>=8.4.1,<9.0.0",
    "cachetools (>=6.1.0,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dev-dependencies]
flake8 = ">=7.3.0,<8.0.0"
black = ">=25.1.0,<26.0.0"
isort = ">=6.0.1,<7.0.0"
mypy = ">=1.17.0,<2.0.0"
flake8-bugbear = ">=24.12.12,<25.0.0"
types-requests = ">=2.32.4.20250611,<3.0.0"
pytest-mock = ">=3.12.0,<4.0.0"

[tool.black]
line-length = 119
target-version = ["py312"]
exclude = '''
/(
    \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["tbank_transaction_analyzer"]
force_sort_within_sections = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
exclude = [".*venv.*"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "test_*"
]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--verbose --color=yes"
